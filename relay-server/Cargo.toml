[package]
name = "relay-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Konclave's blind mailbox relay, standalone + public (CORS) for konclave.xyz multi-device ceremonies. Mirrors orchestrator/src/relay.rs; carries only opaque/encrypted bytes."

# Its own workspace (not a member of the repository's), so its Cargo.lock is the one the image
# builds with `--locked` and the one CI tests: one lock, no copy to keep in step.
# A dependency fix lands here as well as in the root lock: `cargo update --manifest-path
# relay-server/Cargo.toml -p <crate>`, and an advisory scan reads `cargo audit --file relay-server/Cargo.lock`.
[workspace]

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
konclave-http = { path = "../konclave-http" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
