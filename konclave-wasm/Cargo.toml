[package]
name = "konclave-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Konclave browser signer core (WS1): FROST redpallas round + Orchard action verification + ZIP-244 sig_digest, compiled to WASM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# FROST-redpallas signing round (proven wasm-clean: wasm-signer-spike)
reddsa = { version = "0.5.2", features = ["frost"] }
# The rerandomized-FROST `sign` that takes an explicit randomizer (the Orchard alpha), which reddsa's
# curated `rerandomized` module doesn't re-export. Pinned to reddsa 0.5.2's transitive version so the
# ciphersuite types unify.
frost-rerandomized = "=3.0.0"
# Orchard action verification + digest surface (proven wasm-clean: wasm-orchard-probe).
# Ironwood: 0.15.x matches the engine's NU6.3 line so the PCZT wire format (v2) parses.
# Released crates.io 0.15.5, same as konclave-signer and as zcash-devtool main - no fork rev and
# no [patch.crates-io]. 0.15.5 declares `unstable-frost` itself, so the feature survives the move.
orchard = { version = "0.15.5", default-features = false, features = ["unstable-frost"] }
# ZIP-244 sig_digest recompute (proven wasm-clean: wasm-sighash-probe)
blake2b_simd = "1"
# PCZT parse + FROST signature injection (the FROST<->PCZT bridge, ported from konclave-signer).
# ONLY the `orchard` feature: the `low_level_signer` role's `sign_orchard_with` is not gated behind
# `signer`, so we get PCZT parse + Orchard spend signing WITHOUT pczt's `signer`/`transparent`
# features, which would drag in secp256k1 (C) and zcash_script (C++) and break the wasm32 build.
# The shielded sighash is passed IN (it is public data - the message the FROST quorum signs - and
# computing it from the full tx needs zcash_primitives, which stays native/off-device).
# default-features = false is LOAD-BEARING, and more so since pczt 0.9.3: its `default` set gained
# "orchard"+"sapling", so taking defaults here would pull sapling-crypto into the wasm32 graph.
pczt = { version = "0.9.3", default-features = false, features = ["orchard"] }
ff = "0.13"
# --- Ironwood (NU6.3): mirror the engine's released librustzcash line so the PCZT wire format
# (v2) parses in the browser. No signer/transparent features, so the wasm32 build stays free of
# secp256k1 (C) / zcash_script (C++). ---
hex = "0.4"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
# The confidential channel for the DKG's secret round-2 packages (Milestone 3b): seal each
# to its recipient so the blind relay carries only ciphertext. ECIES over X25519.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

# The zcash crates above are released crates.io versions (no workspace [patch.crates-io], zero git
# sources in Cargo.lock); they stay in sync with konclave-signer / the engine so the v2 PCZT parses
# byte-exact.
