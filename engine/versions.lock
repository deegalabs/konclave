zcash_client_backend = "0.24.0-rc.1"

# NOTE: sha256 values are for binaries built on THIS machine; the build is not bit-reproducible,
# so the authoritative reproducibility anchor is (repo rev + the repo's committed Cargo.lock).
# Recompute these if you rebuild on a different host.
# zcash_client_backend is also LINKED into the Orchestrator/konclave-signer, now at the RELEASED
# crates.io 0.24.0 (no workspace [patch.crates-io], no git rev) - not invoked as a binary, and a
# different version than the frost-tools external binary above, which stays at its own 0.24.0-rc.1.
# That difference is fine: zcash-sign is reached as an EXTERNAL binary and Konclave only calls its
# `generate --ak` subcommand, which never touches a PCZT (interoperation with frost-tools is at the
# PCZT wire level, and only for the paths we do not use).

