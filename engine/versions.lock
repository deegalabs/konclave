# Konclave — engine/versions.lock
#
# Deterministic pin of the official Zcash Foundation tools (Layer 1 — Engine).
# Policy: build from source at a fixed git rev; never follow `main`. Bumps are deliberate.
#
# Verified and pinned in Phase 1A (2026-06-30): all three tools live in ONE repo
# (frost-tools), so a single rev guarantees crypto-version coherence across them.
# Built in WSL2/Ubuntu with rustc 1.96.1.

format = 2
network_target = "NU7"                                            # NU6.3 (Ironwood, mainnet 2026-07-28, block 3,428,143) until block 3,543,405, NU7 from it
reference_tutorial = "https://frost.zfnd.org/zcash/ywallet-demo.html"
ciphersuite = "redpallas"                                         # pass `-C redpallas` -> Rerandomized FROST

# NU6.3 / Ironwood readiness (Option A — clean cut at mainnet activation, 2026-07-28).
# FROST / RedPallas is UNCHANGED by the upgrade, so the FROST math is unaffected; what changes is
# the send path (the PCZT bridge + the wallet engine), which is rebuilt against a librustzcash that
# knows the Ironwood pool (V6 transactions, a new shielded pool).
#
# BUMP (2026-08-24): moved off git revs entirely and onto the RELEASED crates.io line. The workspace
# root now carries NO [patch.crates-io] and Cargo.lock has ZERO git sources. Every crate below is a
# published release, so the money path no longer rides on a moving, unaudited git rev.
#
# RE-CUT ONTO MAIN (2026-10-01, #120). That bump was made on `feat/engine-ironwood-bump` (PR #259) and
# never merged; it is re-applied here to `main` instead, and #259 is closed unmerged. Same released
# line, plus zcash_protocol 0.10.6 (its only change from 0.10.5 is experimental NuTachyon items behind
# `--cfg zcash_unstable="nutachyon"`, absent from a default build).
#
# The linked (not invoked) librustzcash / orchard crate set:
#       pczt 0.9.3 · zcash_client_backend 0.24.0 (carries #2778, the ZIP-32 stamping fix for the
#       Orchard migration-dummy, which survived rc.6 into the final) · zcash_primitives 0.30.1 ·
#       zcash_client_sqlite 0.22.0 · zcash_protocol 0.10.6 · zcash_keys 0.16.1 · zcash_address
#       0.13.0 · zip321 0.9.0 · zcash_transparent 0.10.0 · zcash_pool_migration 0.1.0
#       orchard 0.15.5
#
# Why the two old git pins could be dropped:
#   - orchard `unstable-frost` (RedPallas spend-auth extraction, needed by konclave-signer and
#       konclave-wasm): published orchard 0.15.5 declares `unstable-frost = []` in its own [features]
#       table (verified in the crate source), so the zcash/orchard fork rev 3bd2b736 is unnecessary.
#       The two crates enable the feature per-manifest.
#   - the deferred-anchor work (zcash/orchard PR #535) that fork rev carried: RELEASED in orchard
#       0.15.2, so 0.15.5 is a strict superset of rev 3bd2b736, not a divergence from it.
#   - the interim librustzcash holds (42ffd0d, then 6c07e5f3): the crates they anticipated are now
#       published, and the rc versions 6c07e5f3 carried (backend 0.24.0-rc.6, sqlite 0.22.0-rc.6,
#       zip321 0.9.0-rc.1) have all reached their finals.
#
# ALIGNMENT (ADR-0002, checked 2026-08-24): zcash-devtool main is on the SAME released crate set with
# no patch table and zero git sources of its own, so producer and consumer now resolve literally the
# same crate artifacts instead of merely pointing at the same git rev. See [source.zcash-devtool]
# below for the one honest caveat (upstream 539ae81d needs a local patch to BUILD on this line).
#
# Byte-compat re-validated in-tree on the released crates: the konclave-signer and konclave-wasm
# Ironwood fixtures (a REAL proven V6 PCZT and its signed form from a testnet 2-of-3 ceremony) parse
# and reproduce byte-for-byte under pczt 0.9.3 (`inject_reproduces_signed_ironwood_pczt` plus the
# pinned sighash / randomizer values pass), so the V6 wire format is stable across the
# 42ffd0d -> 6c07e5f3 -> released-crates moves. Test counts on this pin set when re-cut onto main
# (2026-10-01): konclave-signer 9, konclave-wasm 30, orchestrator 304, helper-server 69, ui 741
# (vitest) and 64 (Playwright), all passing.
#
# NOT covered by any byte-exact fixture: the multi-output payroll builder
# (`create_pczt_from_proposal` in konclave-signer). It is compile-verified and its call signature is
# unchanged, but no fixture pins its OUTPUT bytes, so a fee / padding / anchor behavior shift between
# the rc and released backend would be invisible here. Do a live dry-run against the reference
# devtool before any broadcast on this pin set.

[source.frost-tools]
repo = "https://github.com/ZcashFoundation/frost-tools"
rev  = "06c0dbdbb1bac9b99cd255e74ba2f387c295e660"                 # zcash-sign Ironwood V6 support (PR #593, merged 2026-08-12)
# Transitive deps are locked by the repo's committed Cargo.lock at this rev. At #593 frost-tools
# pins pczt 0.8.0-rc.1 / zcash_client_backend 0.24.0-rc.1 and an orchard "unstable-frost" fork
# (conradoplg/orchard rev 42015f15733b95e179189628d6fa34d92b5b3b8b). zcash-sign is invoked as an
# EXTERNAL binary, so this differs from our linked-library pin above; interoperation is at the
# PCZT wire level (pczt 0.9 <-> 0.8 V6 envelopes), not at the Rust API level.

# The reference Ironwood PCZT tool. The coordinator invokes it as an external binary; it is recorded
# so the librustzcash / orchard pins above can be checked against it (their patch set must match,
# ADR-0002).
[source.zcash-devtool]
repo = "https://github.com/zcash/zcash-devtool"
rev  = "539ae81d6e793d15ea6ed3fb4157973545e27326"                 # main HEAD as of 2026-08-22
patch        = "engine/patches/zcash-devtool-539ae81d-released-line.patch"
patch_sha256 = "238677420e320f7922323641b81a42da757098fc11d30938b4776d72701cf05e"
# Upstream rev 539ae81d does NOT build against the released crate line unmodified: its `migration`
# subcommand calls a zcash_pool_migration API that is ahead of the published 0.1.0. The patch above
# re-pins the manifest and Cargo.lock to the released versions and puts that subcommand behind an
# off-by-default `pool-migration` feature. Konclave never invokes it (only `pczt create`, `pczt
# prove`, `pczt send`), so the gate does not touch our path. The build is upstream rev PLUS this
# patch; upstreaming it would let the patch go.
# With the patch, the manifest and Cargo.lock resolve orchard 0.15.5, pczt 0.9.3,
# zcash_client_backend 0.24.0, zcash_primitives 0.30.1, zcash_protocol 0.10.5, zcash_client_sqlite
# 0.22.0, zcash_keys 0.16.1, zcash_address 0.13.0, zip321 0.9.0, zcash_transparent 0.10.0, with zero
# git sources: the same released set the workspace links.
#
# THE BUILD THAT SHIPS, and where it comes from: zcash-devtool sha256
#   8c41afd3950d2b169c6880ef99a7d0c3c6e22061507115f789a1b5589c526153
# built 2026-08-23 on the build host, rustc 1.95.0, `cargo build --release --locked`, from upstream
# 539ae81d plus the patch above. The patch was committed on 2026-10-03, after the build, from the
# build tree itself (`git diff` against 539ae81d). Checked that day: the patch applied to a clean
# export of 539ae81d reproduces the build tree file by file (98 files, no difference), and cargo
# reports the 8c41afd3 artifact Fresh for that tree (`--locked --offline`, nothing rebuilt). This is
# the same build the 2026-08-24 deploy shipped ([[deploy_binary]] below). It has NOT been rebuilt from
# scratch on another path or host; build paths end up in the binary, so a rebuild elsewhere is
# expected to hash differently while compiling the same source.
#   To rebuild: export 539ae81d, `git apply` the patch, `cargo build --release --locked`.
# Superseded: 045c32288b359caea337a1334dce60a813f9295a3b94eb8abf51a44a93965ce7 (2026-08-22, rc pins).

# THE NU7 DEVTOOL (recorded 2026-10-26, BEFORE any build of it; deployed to production on 2026-10-30, see `status`).
# zcash-devtool upstream has no build that follows NU7 on mainnet: its `main` still pins the
# `-pre.N` crates and a librustzcash git rev, and `zcash_protocol 0.11.0-pre.1` has no mainnet NU7
# height. The released stable line (2026-10-21: zcash_protocol 0.11.0 = NU7 at 3,543,405, branch
# 0x77190AD9) is what this patch moves the manifest to. Same recipe as the entry above: upstream
# rev PLUS a patch, rebuilt with `cargo build --release --locked`.
[source.zcash-devtool-stable]
repo         = "https://github.com/zcash/zcash-devtool"
rev          = "0b3436bb"                                          # main as of 2026-10-17 (merge of PR 258)
patch        = "engine/patches/zcash-devtool-0b3436bb-stable-crates.patch"
patch_sha256 = "7fa2670a2d2418ea7aaa8f7b3413dedc1d627d0d407aaddfa9891c4ae6f19d0c"
lockfile        = "engine/patches/zcash-devtool-0b3436bb-stable-crates.Cargo.lock"
lockfile_sha256 = "250569dfaab9520804b0b76b251635c54d860d0ea7949eb4f97f76ff8c5dfe18"
status       = "built 2026-10-26 from the recorded inputs; on staging since 2026-10-30 15:00 BRT (deployment 80e5a9ed) and on production since 2026-10-30 19:28 BRT (deployment f6553ee8, engine B); unchanged by the coordinator hotfix of 2026-10-31"
built_sha256 = "5df38d2cd1aa857ab6fc83d7b57769da389c47c015d8971562ed071b9f743c08"
built_bytes  = 103881728
# Built from an export of 0b3436bb plus the patch and the lockfile above, `cargo build --release
# --locked --bin zcash-devtool`, rustc 1.99.0, own target directory, 2026-10-26. A second build on the
# same host came out byte-identical (observed once; across hosts it is not claimed, since build paths
# end up in the binary). The same engine set of that day,
# `bin.nu7-recut-c196c03` on the build host: our helper-server (3567816 bytes, sha256 27b73b4a53b1...),
# our konclave-signer (8230640 bytes, sha256 fbfd5247419b...) built from commit c196c03 of the re-cut
# branch, this devtool, and the unchanged zcash-sign. Checked against the previous devtool: the usage
# of the subcommands Konclave calls (8 of them, plus `pczt inspect`, `wallet list-accounts` and
# `wallet get-info`, which are only inspected) is identical, `balance --json` has the same keys, and a
# COPY of an EMPTY view-only wallet written by the previous engine opens and migrates (71 to 75
# migrations, one new table) and syncs. A wallet WITH history was rehearsed on 2026-10-30, on a copy
# and then for real. On staging, the pre-deploy copy of a vault with 12 send records and 21 listed
# transactions (Ironwood notes only) was read by the previous devtool (26,000 zat), upgraded by this
# one on a second copy ("Wallet successfully upgraded!", migrated marker yes, the same 26,000 zat); the
# previous devtool then opened and synced a copy of the live, migrated wallet (exit 0, the same
# balance), and a copy of the pre-deploy wallet put back with `mv -T` and `cp -a` caught up to the live
# balance. On production the first reads after the deploy migrate a vault's wallet in place (one way):
# the S5b probe of 2026-10-30 ~19:41 BRT read one wallet migrated and four not, and a real send from
# a vault whose wallet the first read had migrated followed (`cca888cd...`, block 3,536,349, V6),
# then another after the hotfix (`38fdbd9a...`, block 3,536,637). NOT rehearsed: a wallet with Sapling
# or transparent history (the three migrations that cannot be reverted rewrite rows only where that
# history exists), and the restore on production itself.
# What the patch does: the 11 pre-release pins of the manifest go to the released crates (protocol
# 0.11.0, primitives 0.31.0, backend 0.25.0, sqlite 0.23.0, pczt 0.10.0, keys 0.17.0, address 0.14.0,
# transparent 0.11.0, zip321 0.10.0, pool_migration 0.2.0, proofs 0.31.0), the `[patch.crates-io]`
# git block is removed, and five command files move to `PrecomputedSighashData` and
# `BlockSpacing`. No edit in `pczt create`, `pczt prove`, `pczt send` or the `wallet` tree, the
# commands Konclave sends money through. To apply: export 0b3436bb, `patch -p1` the patch (paths carry one
# leading directory), copy the lockfile over `Cargo.lock`, `cargo build --release --locked`.
# Resolves, with zero git sources: orchard 0.16.0, sapling-crypto 0.9.0, rusqlite 0.37.0 and the
# crates above, plus one pre-release left in the graph by a dependency (`kem 0.3.0-pre.0`, transitive).
# `zcash_client_sqlite` 0.23.0 adds migrations that cannot be reverted: this devtool
# is only ever opened on COPIES of wallets until the production snapshot is taken (README of the
# deploy, "the upgrade is one-way").
# What runs the migrations, checked 2026-10-29 on copies of a funded wallet: ONLY `zcash-devtool wallet
# upgrade`, which the coordinator runs before a sync or a read (`orchestrator/src/wallet.rs`, `upgrade`).
# `konclave-signer` only opens the wallet (`WalletDb::for_path`) and never migrates it, and `wallet
# balance` does not either; the new devtool's `wallet sync` on an unmigrated wallet FAILS ("no such table")
# until `upgrade` has run. So the four binaries ship as ONE set and the wallet copies are taken BEFORE
# the first read after the deploy. The previous signer and devtool did open, upgrade (a no-op) and sync a
# migrated wallet without error on that one-note wallet: a rollback is not proven to fail on such a wallet,
# and it is not proven safe on one with Sapling or transparent history, so the wallet copy stays the rollback.

