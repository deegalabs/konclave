[package]
name = "konclave-seal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

# The confidential-channel primitive (ECIES over X25519), shared by konclave-wasm (browser) and the
# orchestrator (hosted helper) so ONE implementation seals both DKG round-2 packages and the
# SignRequest (#63). Pure Rust and wasm-clean; getrandom's `js` feature is enabled by the downstream
# crate (konclave-wasm) via feature unification, so this crate stays neutral for the native build.
[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
# For the `pczt` feature: the rule for which spends of a PCZT a vault signs, read by both signers
# (konclave-wasm and konclave-signer), so it is written once. For the `receivers` feature: what a
# viewing key derives, read by the device and the coordinator. The same orchard release both link.
orchard = { version = "0.16.0", default-features = false, features = ["unstable-frost"], optional = true }
ff = { version = "0.14", optional = true }
# Only the `orchard` feature, and no defaults, so the wasm32 build stays free of sapling and the
# transparent code (see konclave-wasm). It is what the one fee/action reader below reads.
pczt = { version = "0.10.0", default-features = false, features = ["orchard"], optional = true }
zcash_address = { version = "0.14.0", optional = true }
zcash_protocol = { version = "0.11.0", default-features = false, optional = true }
# Only for the `share-sig` feature: the 0.5.2 line konclave-wasm signs room messages with, without
# its `frost` feature. orchard links reddsa 0.6.1 for itself; keys cross between them only as bytes.
reddsa = { version = "0.5.2", optional = true }
pasta_curves = { version = "0.5", default-features = false, optional = true }
# Only for `share-sig`: what a usable write key is, and a certificate's one JSON form.
ed25519-dalek = { version = "2", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
pczt = ["dep:orchard", "dep:ff", "dep:pczt"]
share-sig = ["dep:reddsa", "dep:pasta_curves", "dep:ed25519-dalek", "dep:serde"]
receivers = ["dep:orchard", "dep:zcash_address", "dep:zcash_protocol"]

[dev-dependencies]
# A real dealer's package, to test the package check on what the library produces.
reddsa = { version = "0.5.2", features = ["frost"] }
# Test-only: real PCZT vectors parsed to exercise the spend rule on whole bundles.
pczt = { version = "0.10.0", default-features = false, features = ["orchard"] }
# Seeded dealer keys for the committed signing fixture (deterministic, so it can be regenerated).
rand_chacha = "0.3"
