name: What is running

# Once a day: does every public host run the deploy the repository records (#522, #466)?
# Reads public endpoints only: no secret, no vault id, nothing written anywhere.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: what-is-running
  cancel-in-progress: true

jobs:
  check:
    name: Production runs the recorded deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The lock is read from staging, the release tags from main, and the relay digest from the
          # recorded deploy commit: all of them need the history and the tags.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch the branches the check reads
        run: git fetch --no-tags origin +refs/heads/staging:refs/remotes/origin/staging +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
      # The relay digest is built by the relay's own rule (relay-server/build.rs), from its sources at
      # the deploy the lock records. Never re-implemented in the script.
      - name: Relay digest at the recorded deploy
        id: digest
        run: |
          set -euo pipefail
          deploy=$(node -e 'import("./scripts/what-is-running.mjs").then(m => console.log(m.lockDeployCommit(require("child_process").execFileSync("git", ["show", "origin/staging:engine/versions.lock"], {encoding: "utf8"}))))')
          git worktree add --detach "$RUNNER_TEMP/deploy" "$deploy"
          digest=$(cd "$RUNNER_TEMP/deploy" && cargo run -q -p relay-server -- --digest)
          echo "deploy $deploy relay digest $digest"
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - name: Compare
        env:
          KONCLAVE_RELAY_DIGEST: ${{ steps.digest.outputs.value }}
        run: node scripts/check-deployed.mjs --against-lock
