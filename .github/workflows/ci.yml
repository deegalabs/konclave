name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The changelog is what the forum posts and the desktop release notes are written from
  # (`scripts/release.mjs --notes`). "Remember to update it" is not a mechanism - it decays on the
  # first busy day - so the machine remembers instead.
  #
  # It asks only whether the file was TOUCHED, never what was written. A gate that tried to judge
  # the prose would either be trivially satisfiable or wrong, and the judgement belongs in review.
  #
  # The escape hatch is a `no-changelog` label, for the changes a member genuinely cannot notice:
  # refactors, tests, CI, dependency bumps. Requiring a deliberate label makes skipping a decision
  # someone made rather than a step nobody took.
  changelog:
    name: Changelog (a member-visible change says so)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read this PR's labels live (see below). Read-only: the gate must never be able to
      # label its way past itself.
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did this change anything a member can see?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Labels are read LIVE, not from the event payload. `github.event.pull_request.labels`
          # is a snapshot of the moment the run was triggered, so the obvious way to use the escape
          # hatch - see the gate fail, add the label, re-run - CANNOT work: a re-run replays the
          # original payload and the label is not in it. The hatch existed and was unusable exactly
          # when someone needed it, which was found by needing it.
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" -q '.[].name' \
             | grep -qx 'no-changelog'; then
            echo "Labelled no-changelog - skipping, deliberately."
            exit 0
          fi
          # The MERGE BASE, not `base.sha`. They differ whenever the base branch moved on - or when
          # a PR's base is changed - and diffing from `base.sha` then attributes every commit the
          # base gained to this PR. Found by red-checking this gate: it reported "CHANGELOG.md
          # updated" for a PR whose only file was `ui/src/theme.ts`, because the diff had swept in
          # the base branch's own changelog commit.
          merge_base="$(git merge-base "$BASE" "$HEAD")"
          changed="$(git diff --name-only "$merge_base".."$HEAD")"
          # The RULE lives in scripts/changelog-gate.mjs, not here, and has tests. This gate has
          # already shipped one real bug (the merge-base one above), and shell inside a workflow is
          # the one kind of code nobody can run before merging it.
          #
          # Per product since 2026-09-20: the coordinator and the relay keep their own changelogs,
          # because they deploy by hand on their own clock and a shared `Unreleased` section cannot
          # say which of them a given entry has actually reached.
          printf '%s\n' "$changed" | node scripts/changelog-gate.mjs

      # Released sections are locked: an entry that lands inside an already-cut `## [x.y.z]` is the
      # classic merge accident (the branch left before the cut). HEAD^1 is the base and HEAD the
      # merge result, because pull_request checks out the merge ref. This asks WHERE, never WHAT.
      # A deliberate amendment carries the `changelog-amend` label (read live, like no-changelog).
      - name: Released changelog sections are untouched
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" -q '.[].name' | grep -qx 'changelog-amend'; then
            echo "Labelled changelog-amend - skipping, deliberately."
            exit 0
          fi
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && { [ "$HEAD_REF" = staging ] || [ "$HEAD_REF" = main ]; }; then
            echo "Head is $HEAD_REF of this repository - already passed the lock on the way."
            exit 0
          fi
          node scripts/changelog-sections.mjs lock --branch "$HEAD_REF" CHANGELOG.md ui/CHANGELOG.md helper-server/CHANGELOG.md relay-server/CHANGELOG.md

  # Branch name (blocking) and PR size (warning only). The rules live in scripts/pr-rules.mjs and the
  # pre-push hook calls the same file. Values from the PR enter through env, never inside `run:`.
  # The job name is short and fixed on purpose (see the `rust` job): it may become a required check.
  pr-rules:
    name: PR rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Branch name and size
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" -q '.[].name' | grep -qx 'keep-branch-name'; then
            echo "Labelled keep-branch-name - skipping, deliberately."
            exit 0
          fi
          same=true
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || same=false
          node scripts/pr-rules.mjs check --branch "$HEAD_REF" --same-repo "$same" --base "$BASE_SHA" --head HEAD

  rust:
    # The job NAME is short and fixed on purpose. GitHub truncates a check-run name at 95 characters,
    # and branch protection matches the stored (truncated) string - so naming the crates here meant
    # that adding one moved the cut point, the required check stopped existing under its old name,
    # and every pull request would block on a check that never reports. The crates are listed in the
    # steps below, which is where they can change freely.
    name: Rust (workspace crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            orchestrator
            konclave-signer
            konclave-wasm
            relay-server
            helper-server
      - name: Install build deps (protoc)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Format check
        run: |
          cargo fmt --manifest-path orchestrator/Cargo.toml -- --check
          cargo fmt --manifest-path konclave-signer/Cargo.toml -- --check
          cargo fmt --manifest-path konclave-wasm/Cargo.toml -- --check
          cargo fmt --manifest-path relay-server/Cargo.toml -- --check
          cargo fmt --manifest-path helper-server/Cargo.toml -- --check
          cargo fmt --manifest-path konclave-http/Cargo.toml -- --check
          cargo fmt --manifest-path konclave-seal/Cargo.toml -- --check
      - name: Clippy
        run: |
          cargo clippy --manifest-path orchestrator/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path konclave-signer/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path konclave-wasm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path relay-server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path helper-server/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path konclave-http/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path konclave-seal/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --manifest-path orchestrator/Cargo.toml
          cargo test --manifest-path konclave-signer/Cargo.toml
          cargo test --manifest-path konclave-wasm/Cargo.toml
          cargo test --manifest-path relay-server/Cargo.toml
          cargo test --manifest-path helper-server/Cargo.toml
          cargo test --manifest-path konclave-http/Cargo.toml
          cargo test --manifest-path konclave-seal/Cargo.toml

  wasm:
    name: WASM (konclave-wasm → browser build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: konclave-wasm
      - name: Install wasm-pack
        # Deterministic install from source (pinned version) instead of piping a remote script to a
        # shell (no curl | sh). The Rust toolchain is already set up above. --force pins our exact
        # version over the runner's pre-installed wasm-pack.
        run: cargo install wasm-pack --version 0.13.1 --locked --force
      - name: Build for the browser (wasm32 + wasm-bindgen)
        working-directory: konclave-wasm
        run: wasm-pack build --target web --out-dir /tmp/pkg

  relay-image:
    name: Relay image (the deploy recipe still builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The relay was IMPOSSIBLE TO DEPLOY for ten days and nothing said so (#533). #500 gave it a
      # path dependency on `konclave-http`, which sat outside the Docker build context, so every
      # build failed on `failed to read /konclave-http/Cargo.toml`. Deterministically, from that day.
      #
      # Nobody knew because A BUILD ONLY RUNS WHEN SOMEONE DEPLOYS, and the relay had not needed one
      # since 2026-08-28. It was waiting for whoever next had to ship a relay fix in a hurry, which
      # for a relay is the usual reason to deploy one.
      #
      # `cargo build` cannot catch this: the workspace build succeeds, because in the workspace the
      # sibling crate is right there. Only building the IMAGE exercises the context. So the image is
      # built here, on every push, which is the difference between finding this by accident and being
      # told.
      #
      # It builds and does not push: the deploy still goes out by hand. What this answers is "would
      # it build if we tried", which is the question that had no answer.
      # Retried, because the step depends on Docker Hub and Docker Hub rate-limits anonymous pulls.
      # The first run of this job failed on `failed to fetch oauth token ... connection reset by
      # peer` while resolving `debian:stable-slim` - nothing to do with the code it is checking.
      #
      # That matters more than the minute it costs: a check that cries wolf is a check people learn
      # to scroll past, and this one exists precisely to be believed the day it means something. A
      # registry blip must not be able to say the deploy recipe is broken.
      - name: Build the relay image from the repository root
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build -f relay-server/Dockerfile -t konclave-relay:ci .; then
              exit 0
            fi
            echo "attempt $attempt failed; the registry is the usual reason. waiting $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "three attempts failed: this is the recipe, not the registry"
          exit 1
      # Building only proves the recipe parses. The digest proves the container compiled THIS source:
      # build.rs fingerprints the files it was given, so a `.dockerignore` that quietly dropped one,
      # or a COPY that missed it, produces a different answer here than a local build of the same
      # tree. Compared rather than merely printed.
      - name: The image compiled the sources in this checkout
        run: |
          set -euo pipefail
          in_image="$(docker run --rm konclave-relay:ci relay-server --digest)"
          cargo build --release -p relay-server
          on_disk="$(./target/release/relay-server --digest)"
          echo "image: $in_image"
          echo "repo:  $on_disk"
          test "$in_image" = "$on_disk"

  ui:
    name: UI (Vite/React frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (oxlint)
        run: pnpm -C ui run lint
      - name: Unit tests (vitest)
        run: pnpm -C ui run test
      - name: Type-check + build (tsc -b && vite build)
        run: pnpm -C ui run build
      # The inverse of the check in desktop-release.yml: the web build must ship the workbox worker
      # that precaches the app (opening offline, the update banner), never the desktop's
      # self-destroying one. Rule and tests: scripts/check-sw.mjs.
      - name: Check the service worker is the web one
        run: node scripts/check-sw-cli.mjs web ui/dist/sw.js

  e2e:
    name: UI e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: Run e2e (builds + serves + drives the app; API stubbed via route interception)
        run: pnpm -C ui run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          retention-days: 7

  node-packages:
    name: Node packages (mcp-server · sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: mcp-server (type-check)
        run: pnpm -C mcp-server exec tsc --noEmit
      - name: sdk (type-check)
        run: pnpm -C sdk exec tsc --noEmit
