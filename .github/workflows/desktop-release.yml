# Builds the Tauri desktop installers on each platform and attaches them to a (draft) release.
# Triggered by a version tag (v*) or manually. The draft lets a human review before publishing.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach the installers to (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

# The coordinator and relay the app talks to (#664). Vite inlines `VITE_*` at build time, and the
# release used to build with neither set, so the helper base was '' ("Konclave-hosted" never showed)
# and the relay fell back to the app's own origin, where none answers. These are the production values
# the web build carries (the web takes them from the Vercel project's env, DEPLOY.md). Public
# addresses, not secrets. Change them here and in DEPLOY.md together, and keep each one in the CSP's
# connect-src (orchestrator/src/csp.rs, mirrored into src-tauri/tauri.conf.json); a test checks that.
# Workflow-level since #605: the desktop build and the web manifest's rebuild must use the same two.
env:
  VITE_HELPER_BASE: https://helper.konclave.xyz
  VITE_RELAY_BASE: https://relay.konclave.xyz

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest   # .exe (NSIS only; no .msi since v0.17.0)
          - platform: ubuntu-22.04      # .deb + .AppImage
          - platform: macos-latest      # .dmg (Apple Silicon)
    runs-on: ${{ matrix.platform }}
    # The web manifest is written first: the notes below carry its fingerprint, and a release
    # without a manifest of its web app does not ship installers either (#605).
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, which brings every tag. `release.mjs --notes` covers this version
          # plus any section beneath it that never shipped, and it learns what shipped from the
          # tags. The default checkout carries at most the tag being released, which says nothing
          # about the versions before it (#573).
          fetch-depth: 0
          # The tag on a manual run too, not the branch it starts from: the installers and the web
          # manifest must be built from one commit (#605 review).
          ref: ${{ inputs.tag || github.ref }}

      - name: pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Linux deps (webkit for the Tauri webview)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Frontend deps
        run: pnpm install --frozen-lockfile

      # Build the UI explicitly here (into ui/dist) rather than via tauri.conf's
      # beforeBuildCommand: tauri-action runs before-commands from a different cwd than a local
      # `tauri build`, and no single relative --prefix works for both. So beforeBuildCommand is
      # empty and the frontend is built here, cwd-unambiguously, from the repo root.
      #
      # KONCLAVE_DESKTOP_BUILD=1 makes the bundle's service worker a self-destroying one
      # (ui/vite.config.ts): the desktop app has no use for a worker, and the one v0.15.0 left in
      # the WebView profile opened v0.16.0 to a blank window on Windows. Without it the installers
      # ship the web's worker again.
      - name: Build UI
        env:
          KONCLAVE_DESKTOP_BUILD: '1'
        run: pnpm -C ui run build

      # The flag is checked by what it produced, not trusted: the installers must carry the
      # self-destroying sw.js (unregisters itself, precaches nothing). A web worker here would put the
      # blank-window defect back into every installer. The rule and its tests: scripts/check-sw.mjs.
      - name: Check the service worker is the self-destroying one
        run: node scripts/check-sw-cli.mjs desktop ui/dist/sw.js

      # Fails the release when the bundle does not carry both addresses (#664): an empty or invalid
      # variable, or one the build never inlined. The rule is in the script, with tests
      # (ui/src/desktop-bundle-check.test.ts), not written as shell here.
      - name: Check the bundle carries the coordinator and relay
        run: node scripts/check-desktop-bundle-cli.mjs

      # Pull the release notes for this tag from CHANGELOG.md so the GitHub release matches the
      # in-app version.
      #
      # Runs on EVERY platform, not just Linux. Each matrix job is a separate job with its own
      # `steps` context, and all three call tauri-action against the same release - so whichever
      # finishes first is the one whose body sticks. Scoped to Linux, the other two passed the
      # `Desktop installers...` fallback, and v0.3.0 shipped a draft with no notes at all because
      # Windows won. Computing it three times costs one `node` call per job and removes the race
      # instead of betting on the ordering.
      #
      # `shell: bash` because the Windows runner defaults to pwsh, where the heredoc and
      # `>> "$GITHUB_OUTPUT"` below are not syntax. That default is why this was Linux-only.
      # The notes list the release's commits by type (git-cliff, cliff.toml) under the CHANGELOG's
      # prose. Pinned by version and installed with --locked, as ci.yml installs wasm-pack: no
      # `curl | sh`, no new third-party action. In CI a git-cliff failure fails the notes step (and
      # with it this platform's installers, as a failed notes step always did): a release body never
      # loses its list without a red job. Re-run the job if crates.io was down.
      - name: Install git-cliff (pinned)
        shell: bash
        run: cargo install git-cliff --version 2.14.2 --locked

      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        # The tag is untrusted input (a crafted tag/branch name could inject shell). Pass it through
        # an env var so the shell treats it as data, never interpolate ${{...}} into the run: script.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # Written by web-manifest-cli.mjs in the web job; data, through env, never interpolated.
          WEB_NOTES: ${{ needs.web.outputs.notes }}
        run: |
          test -n "$WEB_NOTES" || { echo "the web job gave no notes line"; exit 1; }
          git-cliff --version
          {
            echo 'body<<KONCLAVE_EOF'
            node scripts/release.mjs --notes "$TAG"
            echo ''
            echo 'Desktop installers (Windows / macOS / Linux) are attached below.'
            echo ''
            echo "Built to use the coordinator at $VITE_HELPER_BASE and the relay at $VITE_RELAY_BASE."
            echo ''
            echo "$WEB_NOTES"
            echo 'KONCLAVE_EOF'
          } >> "$GITHUB_OUTPUT"

      # The Tauri CLI that bundles the installers, pinned. Without it tauri-action installs whatever
      # 2.x is newest, and the Windows uninstall hook (src-tauri/windows/hooks.nsh) reads variables of
      # the NSIS template that tauri-cli 2.12.4 carries (tauri-bundler =2.10.4). makensis only warns
      # on an unknown variable, so a newer template could silently disable the question that protects
      # the vaults. src-tauri/tests/config_contract.rs fails if this line changes: move both together.
      - name: Install tauri-cli (pinned)
        shell: bash
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Build + attach installers
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: cargo tauri
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Konclave ${{ inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body || 'Desktop installers (Windows / macOS / Linux).' }}
          releaseDraft: true
          prerelease: true

  # SHA256SUMS of every file attached to the release (#606), once all three platforms have uploaded.
  # If any platform failed, this does not run, so no release carries sums for part of its files.
  # What it proves: that a download is the file this workflow attached. It does not prove who built
  # it - the sums sit on the same release, under the same account - which is what signing and build
  # attestation are for (#606, still open).
  checksums:
    needs: [build, web]
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch web-manifest.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-manifest

      # Before SHA256SUMS, so the sums cover it. Never replaced: a release that already carries a
      # different manifest fails here instead of silently changing what members compare against.
      - name: Attach web-manifest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          FINGERPRINT: ${{ needs.web.outputs.fingerprint }}
        run: |
          set -euo pipefail
          echo "$FINGERPRINT  web-manifest.json" | sha256sum -c -
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx web-manifest.json; then
            mkdir prev && gh release download "$TAG" -p web-manifest.json -D prev
            cmp prev/web-manifest.json web-manifest.json || { echo "release $TAG already carries a different web-manifest.json"; exit 1; }
            rm -rf prev
          else
            gh release upload "$TAG" web-manifest.json
          fi
          rm web-manifest.json

      - name: SHA256SUMS
        shell: bash
        # The tag is untrusted input; it reaches the shell only as data, through env.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG"
          # A re-run finds the previous SHA256SUMS among the assets; it is not one of the files.
          rm -f SHA256SUMS
          ls -1 | grep -q . || { echo "No assets on release $TAG"; exit 1; }
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$TAG" ../SHA256SUMS --clobber

  # The web manifest of this release (#605): the SHA-256 of every file the web app serves, so anyone
  # can compare the live site with it (scripts/verify-web.mjs) or rebuild the commit and compare.
  # Vercel deploys the web from `main` by itself; this job rebuilds the same commit with the same two
  # variables, which gives the same bytes (measured on v0.21.0, 73 of 73 files, once the app stopped
  # inlining the env object). It builds twice and fails if the two differ, so a build that
  # stopped being deterministic shows here, not as a verify-web failure on members' machines.
  web:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      notes: ${{ steps.manifest.outputs.notes }}
      fingerprint: ${{ steps.manifest.outputs.fingerprint }}
    steps:
      # The tag, not the branch a manual run starts from: the manifest names the commit it built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: The checkout is the tag, and the tag is the app's version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")" || { echo "HEAD is not $TAG"; exit 1; }
          version=$(node -p "require('./ui/package.json').version")
          test "$TAG" = "v$version" || { echo "tag $TAG is not v$version (ui/package.json)"; exit 1; }

      - name: pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Frontend deps
        run: pnpm install --frozen-lockfile

      # Not named `Build UI`: that step is the desktop build's, and tests find it by name.
      - name: Build the web app twice
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C ui run build
          mv ui/dist "$RUNNER_TEMP/dist-first"
          pnpm -C ui run build

      - name: Check the web build
        run: |
          node scripts/check-sw-cli.mjs web ui/dist/sw.js
          node scripts/check-desktop-bundle-cli.mjs --web ui/dist

      - name: Write web-manifest.json
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          node scripts/web-manifest-cli.mjs write "$RUNNER_TEMP/dist-first" "$commit" "$RUNNER_TEMP/first.json" > /dev/null
          fp=$(node scripts/web-manifest-cli.mjs write ui/dist "$commit" web-manifest.json)
          cmp "$RUNNER_TEMP/first.json" web-manifest.json || { echo "two builds of $commit differ:"; diff "$RUNNER_TEMP/first.json" web-manifest.json || true; exit 1; }
          # Its own line, so a failure stops the step (inside "$(...)" in an echo, set -e does not see it).
          notes=$(node scripts/web-manifest-cli.mjs notes web-manifest.json)
          test -n "$notes"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "web-manifest.json $fp"

      # Who built it: a signed statement that this workflow, at this commit, produced these bytes.
      # Check it with `gh attestation verify web-manifest.json -R deegalabs/konclave`.
      - name: Attest web-manifest.json
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: web-manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-manifest
          path: web-manifest.json
          if-no-files-found: error
          # A re-run of this job replaces its own artifact instead of failing on the name.
          overwrite: true
