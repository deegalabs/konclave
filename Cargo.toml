[workspace]
resolver = "2"
members = [
  "orchestrator",
  "helper-server",
  "konclave-signer",
  "konclave-wasm",
  "relay-server",
  "src-tauri",
]

# librustzcash crates are pinned to one git rev across the whole workspace (must live at the
# workspace root, not per-member). Kept in sync with the vendored engine (engine/versions.lock).
[patch.crates-io]
