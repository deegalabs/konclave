[package]
name = "helper-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Konclave's hosted BLIND helper (ADR-0006, Rung A): registers vaults by group key, keeps a view-only wallet per vault, builds/proves/broadcasts over Architecture B while the browsers sign. Never sees a share."

[[bin]]
name = "helper-server"
path = "src/main.rs"

[dev-dependencies]
# `test-keys`: the tests build their gateway key from the one list of known test keys, which the
# server's own parser refuses. Dev-only; the coordinator's boot never calls what it adds.
konclave-ohttp = { path = "../konclave-ohttp", features = ["test-keys"] }
orchestrator = { path = "../orchestrator", features = ["test-seed"] }
# The vote-signing test reproduces the DEVICE side exactly.
ed25519-dalek = "2"
# A real dealer's package and a viewing key on its group key, for the protocol-3 routes.
reddsa = { version = "0.5.2", features = ["frost"] }
orchard = { version = "0.16.0", default-features = false }
zcash_address = "0.14.0"
zcash_protocol = "0.11.0"
rand = "0.8"

[dependencies]
konclave-http = { path = "../konclave-http" }
# Oblivious HTTP, the gateway half only (RFC 9458); off unless KONCLAVE_OHTTP=1. Experimental.
konclave-ohttp = { path = "../konclave-ohttp", default-features = false, features = ["server"] }
orchestrator = { path = "../orchestrator" }
konclave-seal = { path = "../konclave-seal", features = ["share-sig"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# statvfs, for the free-space floor before a new vault (admission.rs).
libc = "0.2"
# The gateway's key text is wiped after it is parsed. Already in the lock (bip32, hpke's RustCrypto).
zeroize = "=1.9.0"

[profile.release]
opt-level = 2
